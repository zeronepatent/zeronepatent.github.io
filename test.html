<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리팀 도우미 (시험)</title>
<link rel="icon" href="icon-32.png">
<style>
  html, body { margin: 0; height: 100%; background: #f5f6f8; font: 15px/1.6 sans-serif; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  p { margin: 40px; }
</style>
</head>
<body>
<script>
  // 시험: 시험 앱. Google 로그인 정보를 보내지 않는 틀(계정이 여러 개여도 열리게)에 앱을 넣고,
  // 새로고침 때 지워지는 앱 로그인 토큰과 화면 상태(마지막 탭)는 이 페이지가 맡아 둔다.
  const APP = 'https://script.google.com/macros/s/AKfycbyfCEaeP43YhO7SmQow7_6Tvx6PahpghP__j6vvpNw4URl9hW3Bj6DWAnDr1EU9Ay0O/exec';
  const KEY = 'zerone-admin-helper-token';
  const STATE = 'zerone-admin-helper-state';
  const APP_ORIGIN = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  if (window.top !== window) {
    // 다른 사이트 안에서 열리면 앱을 띄우지 않는다
    document.body.innerHTML = '<p><a href="' + location.href + '" target="_top">관리팀 도우미 열기</a></p>';
  } else {
    window.addEventListener('message', (ev) => {
      if (!APP_ORIGIN.test(ev.origin)) return;
      let ours = false;
      try { ours = ev.source && ev.source.top === window; } catch (err) { ours = false; }
      if (!ours) return;
      const d = ev.data || {};
      try {
        if (d.type === 'zh-token-req') ev.source.postMessage({ type: 'zh-token', token: localStorage.getItem(KEY) || '', state: localStorage.getItem(STATE) || '' }, ev.origin);
        else if (d.type === 'zh-token') { if (d.token) localStorage.setItem(KEY, String(d.token)); else localStorage.removeItem(KEY); }
        else if (d.type === 'zh-state' && typeof d.state === 'string' && d.state.length < 2000) localStorage.setItem(STATE, d.state);
      } catch (err) { /* 저장소를 못 쓰면 매번 로그인 */ }
    });
    const f = document.createElement('iframe');
    f.setAttribute('credentialless', '');
    f.title = '관리팀 도우미';
    f.allow = 'clipboard-write';
    f.src = APP;
    document.body.appendChild(f);
  }
</script>
</body>
</html>
